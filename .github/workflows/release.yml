name: Release plugin
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify version and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const m=require('./manifest.json'); if(m.version!==process.env.RELEASE_TAG||m.version!==require('./package.json').version) process.exit(1)"
          mkdir coherence-wizard
          cp main.js manifest.json styles.css coherence-wizard/
          zip -r "coherence-wizard-${RELEASE_TAG}.zip" coherence-wizard
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css "coherence-wizard-${RELEASE_TAG}.zip" --title "Coherence Wizard $RELEASE_TAG" --generate-notes
